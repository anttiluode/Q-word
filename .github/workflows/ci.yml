name: Q-word checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Verify mathematical identities and controls
        run: python -m unittest discover -s tests -v
      - name: Reproduce receipt deterministically
        run: |
          python -m qword --steps 12000 --seed 4100 --output /tmp/qword-receipt.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/qword-receipt.json'))
          assert x['quantum_exact_max_error'] < 1e-12
          assert x['quantum_empirical_max_error'] < .04
          assert x['classical_empirical_max_error'] < .04
          assert x['oscillator']['first_only_gap'] < 1e-12
          assert x['oscillator']['first_second_gap'] > .05
          assert x['oscillator']['quantum_vs_classical_bloch_max_gap'] < 1e-12
          print('Protocol gates PASS. Oscillator quantum advantage NOT CLAIMED.')
          PY
      - name: Check embedded browser JS syntax
        run: |
          node -e "const s=require('fs').readFileSync('web/index.html','utf8'); const js=s.match(/<script>([\s\S]*?)<\/script>/)[1]; new Function(js); console.log('browser JS syntax PASS')"
