# Publish the public laboratory rather than the entire Python repository.
# IMPORTANT: re-running failed jobs within an existing run can upload another
# artifact named "github-pages"; deploy-pages requires exactly one per run.
# For a retry, start a NEW run via workflow_dispatch or a new commit.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R web results docs _site/
          cp README.md _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0;url=web/index.html">
          <title>Q-word · Research laboratory</title></head>
          <body><p><a href="web/index.html">Open the Q-word research laboratory</a></p></body></html>
          HTML
          test -s _site/web/index.html
          test -s _site/web/sequence.html
          test -s _site/web/mobius.html
          test -s _site/results/mobius-v3.json
          find _site -type f | sort
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
